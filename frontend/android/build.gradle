// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // Force all sub-projects to use Java 17
    afterEvaluate {
        tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Add dummy testClasses task to all subprojects that don't have it
// This prevents "testClasses not found" errors with Capacitor plugins
subprojects {
    afterEvaluate { project ->
        if (!project.tasks.findByName('testClasses')) {
            project.tasks.register('testClasses') {
                doLast {
                    println "Dummy testClasses task for ${project.name}"
                }
            }
        }
    }
}
